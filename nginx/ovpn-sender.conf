# ovpn-sender за Nginx. Вставить внутрь server { listen 443 ssl; server_name vpn.example.com; ... }
# (через include или текстом), до location /.
# Контейнер: compose.yaml, OVPN_HOST_PORT=8080, OVPN_BASE_URL=https://vpn.example.com/ovpn
#
# OpenVPN Connect отбрасывает путь из введенного URL и всегда ходит в корень хоста:
# /openvpn-api/profile и /rest/GetUserlogin. Поэтому эти два пути - в корне.
# Если Nginx режет клиентов по User-Agent: Connect представляется как "Connect/<версия>/...".

location ^~ /rest/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 401 с XML должен дойти до Connect как есть
    proxy_intercept_errors off;
}

location ^~ /openvpn-api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_intercept_errors off;
}

# Страница ссылки для браузера: https://vpn.example.com/ovpn/p/<token>
location ^~ /ovpn/ {
    proxy_pass http://127.0.0.1:8080/;   # слэш срезает /ovpn
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_intercept_errors off;
}
